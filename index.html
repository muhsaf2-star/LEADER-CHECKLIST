<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leader Checklist</title>
<style>
:root{--blue:#1677ff;--navy:#10243e;--bg:#f5f8fc;--green:#20b56b;--red:#ef4d5a;--yellow:#f2b84b;--text:#182230;--muted:#718096;--line:#e4eaf2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#10243e,#1677ff)}
.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 60px #001b3a35}
.logo{font-weight:800;font-size:24px}.sub{color:var(--muted);margin:7px 0 24px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}.field input:focus{border-color:var(--blue)}
.primary{width:100%;padding:13px;border-radius:11px;background:var(--blue);color:#fff;font-weight:800}.error{color:var(--red);font-size:13px;margin-top:10px}
.layout{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:900;padding:8px 12px 25px}.nav button{display:block;width:100%;padding:12px;margin:5px 0;text-align:left;background:transparent;color:#dce7f5;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff15;color:#fff}.main{margin-left:235px;width:calc(100% - 235px);padding:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{font-size:26px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.pill{padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.card .big{font-size:27px;font-weight:900;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:#b37a00}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.panel h3{margin:0 0 14px}.barrow{margin:11px 0}.barlabel{font-size:12px;margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}.bar{height:10px;border-radius:99px;background:#edf1f6;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}.bar.greenbar>i{background:var(--green)}.bar.redbar>i{background:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.bg{background:#e9f8f1;color:#12824c}.br{background:#ffecee;color:#c72f3c}
.question{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.qhead{display:flex;gap:10px}.qno{font-weight:900;color:var(--blue);min-width:28px}.qtext{font-weight:700}.opts{display:flex;gap:8px;margin:12px 0 0 38px;flex-wrap:wrap}.opts label{border:1px solid var(--line);border-radius:9px;padding:8px 12px}.opts input{margin-right:5px}.note{margin:10px 0 0 38px}.note textarea{min-height:58px}.extra{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 0 38px}.savebar{position:sticky;bottom:10px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 10px 30px #001b3a12}.savebar button{background:var(--blue);color:#fff;padding:12px 20px;border-radius:10px;font-weight:800}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}
.mobile-menu-btn{display:none;background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;font-weight:900;font-size:20px;line-height:1}.mobile-drawer{display:none;position:fixed;z-index:1000;inset:0;background:#0008}.mobile-drawer-card{position:absolute;left:0;top:0;bottom:0;width:min(300px,84vw);background:var(--navy);color:#fff;padding:18px 14px;box-shadow:10px 0 30px #0004}.mobile-drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.mobile-drawer-head b{font-size:18px}.mobile-close{background:#ffffff18;color:#fff;border-radius:8px;padding:7px 11px;font-size:18px}.mobile-nav button{display:block;width:100%;padding:13px 12px;margin:5px 0;text-align:left;background:transparent;color:#dce7f5;border-radius:10px}.mobile-nav button.active,.mobile-nav button:hover{background:#ffffff15;color:#fff}.top-left{display:flex;gap:10px;align-items:flex-start;min-width:0}@media(max-width:900px){.side{width:72px}.brand{font-size:0}.brand:after{content:"LC";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:20px}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
.mobile-menu-btn{display:flex!important}
.main{padding:12px;margin-left:0!important;width:100%!important}
.top{padding:2px 0 10px;align-items:flex-start}
.top h1{font-size:20px}
.cards,.grid2{grid-template-columns:1fr}
.question{padding:12px}.opts,.note,.extra{margin-left:0}.extra{grid-template-columns:1fr}
.side{display:none!important}
.mobile-drawer{display:none!important}
.mobile-drawer.open{display:block!important}
}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">LEADER CHECKLIST</div>
    <div class="sub">Daily Store Monitoring</div>
    <div class="field"><label>Username</label><input id="username" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="primary" onclick="login()">MASUK</button>
    <div id="loginErr" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
<div class="layout">
  <aside class="side">
    <div class="brand">LEADER CHECKLIST</div>
    <div class="nav">
      <button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
      <button onclick="showPage('checklist',this)">Daily Checklist</button>
      <button onclick="showPage('history',this)">Riwayat</button>
      <button onclick="showPage('findings',this)">Temuan</button>
      <button onclick="showPage('monthly',this)">Laporan Bulanan</button>
      <button id="allAreaNav" onclick="showPage('allarea',this)">All Area</button>
      <button onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="top-left"><button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Buka menu">☰</button><div><h1 id="pageTitle">Dashboard Hari Ini</h1><div class="muted" id="identity"></div></div></div>
      <div class="pill" id="clock"></div>
    </div>
    <div id="mobileDrawer" class="mobile-drawer" onclick="if(event.target===this)toggleMobileMenu()">
      <div class="mobile-drawer-card">
        <div class="mobile-drawer-head"><b>LEADER CHECKLIST</b><button class="mobile-close" onclick="closeMobileMenu()">✕</button></div>
        <div class="mobile-nav">
          <button onclick="mobileGo('dashboard',this)">🏠 Dashboard</button>
          <button onclick="mobileGo('checklist',this)">✓ Daily Checklist</button>
          <button onclick="mobileGo('history',this)">🕘 Riwayat</button>
          <button onclick="mobileGo('findings',this)">🔴 Temuan</button>
          <button onclick="mobileGo('monthly',this)">📊 Laporan Bulanan</button>
          <button id="mobileAllAreaNav" onclick="mobileGo('allarea',this)">🌐 All Area</button>
          <button onclick="logout()">↪ Logout</button>
        </div>
      </div>
    </div>
    <section id="dashboard" class="page"></section>
    <section id="checklist" class="page hidden"></section>
    <section id="history" class="page hidden"></section>
    <section id="findings" class="page hidden"></section>
    <section id="monthly" class="page hidden"></section>
    <section id="allarea" class="page hidden"></section>
  </main>
</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyIau4TJNG_KeY3L3kR7C8TT1hnnOIZz2ODhYy-0NMDlO_0EDa2AOir-yiK7hfTsslLcw/exec';
const state={user:null,questions:[],today:null};

function api(action,payload={}){
  return new Promise((resolve,reject)=>{
    const cb='lc_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    const params=new URLSearchParams({action:action,callback:cb,payload:JSON.stringify(payload)});
    let done=false;
    window[cb]=(data)=>{done=true;cleanup();resolve(data)};
    script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('Apps Script connection failed'))};
    function cleanup(){try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()}
    script.src=API_URL+'?'+params.toString();
    document.body.appendChild(script);
  });
}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function login(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
  document.getElementById('loginErr').textContent='Memproses...';
  api('login',{username:u,password:p}).then(r=>{
    if(!r.ok){document.getElementById('loginErr').textContent=r.message||'Login gagal';return}
    state.user=r.user; localStorage.setItem('lc_user',JSON.stringify(r.user));
    document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
    document.getElementById('identity').textContent=`${state.user.name} • ${state.user.role} • ${state.user.storeName||'ALL AREA'}`;
    if(state.user.role!=='TSH' && state.user.role!=='ADMIN'){document.getElementById('allAreaNav').style.display='none';document.getElementById('mobileAllAreaNav').style.display='none';}
    showPage('dashboard'); loadDashboard();
  }).catch(e=>document.getElementById('loginErr').textContent='API belum terhubung / URL belum diisi');
}
function logout(){localStorage.removeItem('lc_user');location.reload()}
function toggleMobileMenu(){const d=document.getElementById('mobileDrawer');d.classList.toggle('open')}
function closeMobileMenu(){document.getElementById('mobileDrawer').classList.remove('open')}
function mobileGo(id,btn){closeMobileMenu();showPage(id);}
function showPage(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');
 const titles={dashboard:'Dashboard Hari Ini',checklist:'Daily Checklist',history:'Riwayat Checklist',findings:'Temuan',monthly:'Laporan Bulanan',allarea:'All Area'};
 document.getElementById('pageTitle').textContent=titles[id];
 if(id==='dashboard')loadDashboard(); if(id==='checklist')loadChecklist(); if(id==='history')loadHistory(); if(id==='findings')loadFindings(); if(id==='monthly')loadMonthly(); if(id==='allarea')loadAllArea();
}
function loadDashboard(){
 api('dashboard',{date:today(),store:state.user.store}).then(r=>{
  state.today=r;
  const ok=r.okItems||[],bad=r.findings||[];
  document.getElementById('dashboard').innerHTML=`
  <div class="cards">
    <div class="card"><div class="muted">Total Pertanyaan</div><div class="big">${r.total||24}</div></div>
    <div class="card"><div class="muted green">Sesuai / OK</div><div class="big green">${ok.length}</div></div>
    <div class="card"><div class="muted red">Temuan</div><div class="big red">${bad.length}</div></div>
    <div class="card"><div class="muted">Jam Checklist</div><div class="big">${r.lastTime||'-'}</div></div>
  </div>
  <div class="grid2">
   <div class="panel"><h3 class="green">🟢 Yang Sesuai</h3>${bars(ok,'green')}</div>
   <div class="panel"><h3 class="red">🔴 Temuan</h3>${bars(bad,'red')}</div>
  </div>
  <div class="panel" id="dashboardQuiz"><h3>Monthly Quiz</h3><div class="muted">Memuat status...</div></div>
  <div class="grid2">
   <div class="panel"><h3>Detail Temuan Hari Ini</h3>${bad.length?bad.map(x=>`<div class="question"><b>${esc(x.question)}</b><div class="muted">${esc(x.note||'Tidak ada catatan')} • ${esc(x.time||'')}</div></div>`).join(''):'<div class="muted">Tidak ada temuan.</div>'}</div>
   <div class="panel"><h3>Checklist Terakhir</h3><table class="table"><tr><th>No</th><th>Pertanyaan</th><th>Jawaban</th></tr>${(r.latest||[]).map(x=>`<tr><td>${x.no}</td><td>${esc(x.question)}</td><td><span class="badge ${x.ok?'bg':'br'}">${x.answer}</span></td></tr>`).join('')}</table></div>
  </div>`;
  loadDashboardQuiz();
 }).catch(()=>document.getElementById('dashboard').innerHTML='<div class="panel">Gagal mengambil data dashboard.</div>');
}
function loadDashboardQuiz(){
 api('quiz',{date:today(),store:state.user.store}).then(r=>{
  const done=(r.ero||[]).filter(x=>x.status==='Ya'), belum=(r.ero||[]).filter(x=>x.status!=='Ya');
  document.getElementById('dashboardQuiz').innerHTML=`<h3>Monthly Quiz</h3><div class="grid2" style="margin-top:0">
  <div><b class="green">🟢 ERO Sudah (${done.length})</b><div class="muted">${done.map(x=>esc(x.name)).join(' • ')||'-'}</div></div>
  <div><b class="red">🔴 ERO Belum (${belum.length})</b><div class="muted">${belum.map(x=>esc(x.name)).join(' • ')||'-'}</div></div></div>
  <div style="margin-top:10px"><b>SL:</b> <span class="badge ${r.sl==='Ya'?'bg':'br'}">${r.sl}</span></div>`;
 }).catch(()=>{});
}
function bars(items,type){if(!items.length)return '<div class="muted">Belum ada data.</div>';return items.map(x=>`<div class="barrow"><div class="barlabel"><span>${esc(x.question)}</span><b>${x.count||1}</b></div><div class="bar ${type}bar"><i style="width:${Math.min(100,(x.count||1)*25)}%"></i></div></div>`).join('')}
const LOCAL_QUESTIONS = [
 [1,'Grooming Staff sesuai?'],
 [2,'Apakah ada team standby saat masuk?'],
 [3,'Apakah Area Floor Bersih?'],
 [4,'Apakah Area LDU Bersih dari kotoran?'],
 [5,'Apakah LDU ada yg mati?'],
 [6,'Apakah TV promotion Hidup dan memutar materi promo?'],
 [7,'Apakah Retail Mode menyala dan Price App update?'],
 [8,'Apakah penataan acc sudah sesuai?'],
 [9,'Apakah Mesin Edc berfungsi siap digunakan?'],
 [10,'Apakah Price list dan Promo sudah update di PL?'],
 [11,'Apakah ada lampu yang mati?'],
 [12,'Apakah Area gudang staff bersih?'],
 [13,'Apakah Gudang device rapih?'],
 [14,'Apakah sudah setoran?'],
 [15,'Apakah sudah SO Harian?'],
 [16,'Apakah Ada barang Gantung antar store/dari gudang/retur ke gudang?'],
 [17,'Apakah ada barang CPFR Belum di GR?'],
 [18,'Apakah trade in sudah Ready for Pickup?'],
 [19,'CEK DO, apakah sudah di arsip?'],
 [20,'Cek internet, Apakah Berfungsi?'],
 [21,'Apakah sudah melakukan Briefing?'],
 [22,'Apakah cctv menyala?'],
 [23,'Apakah ada Barang DOA / Returan ke gudang?'],
 [24,'Apakah Monthly Quiz sudah selesai?']
];
function loadChecklist(){
 const box=document.getElementById('checklist');
 box.innerHTML='<div class="panel"><div class="muted">Memuat 24 checklist...</div></div>';
 api('questions').then(r=>{
   state.questions=(r.questions&&r.questions.length)?r.questions:LOCAL_QUESTIONS.map(x=>({no:x[0],question:x[1]}));
   renderChecklist();
 }).catch(()=>{
   state.questions=LOCAL_QUESTIONS.map(x=>({no:x[0],question:x[1]}));
   renderChecklist();
 });
}
function renderChecklist(){
 document.getElementById('checklist').innerHTML=`<div class="panel"><div class="muted">Tanggal otomatis: ${today()} • Store terkunci: <b>${esc(state.user.storeName||'ALL AREA')}</b></div></div>
 <form id="checkForm">${state.questions.map(q=>questionHtml(q)).join('')}
 <div id="quizBox" class="panel" style="margin:12px 0"><h3>Monthly Quiz</h3><div class="muted">Status quiz ERO dan SL untuk store ini.</div><div id="quizContent">Memuat...</div></div>
 <div class="savebar"><span class="muted">Jam submit otomatis tercatat oleh sistem.</span><button type="button" onclick="submitChecklist()">SUBMIT CHECKLIST</button></div></form>`;
 loadQuiz();
}
function questionHtml(q){
 let extras='';
 if(q.no==14) extras=`<div class="extra"><input data-extra="value" placeholder="Value setoran"><input data-extra="depositor" placeholder="Nama penyetor"></div>`;
 if(q.no==15) extras=`<div class="extra"><input data-extra="so" placeholder="Nama yang SO"><input data-extra="companion" placeholder="Pendamping SO"></div>`;
 return `<div class="question" data-no="${q.no}"><div class="qhead"><span class="qno">${q.no}</span><span class="qtext">${esc(q.question)}</span></div><div class="opts">
 <label><input type="radio" name="q${q.no}" value="Ya"> Ya</label>
 <label><input type="radio" name="q${q.no}" value="${q.no==24?'Belum':'Tidak'}"> ${q.no==24?'Belum':'Tidak'}</label></div>
 <div class="note"><textarea data-note placeholder="Catatan (isi bila ada temuan/catatan)"></textarea></div>${extras}</div>`
}
function loadQuiz(){
 api('quiz',{date:today(),store:state.user.store}).then(r=>{
  const e=(r.ero||[]).map(x=>`<label style="display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:4px"><input type="checkbox" data-quiz-ero="${esc(x.name)}" ${x.status==='Ya'?'checked':''}> ${esc(x.name)}</label>`).join('');
  document.getElementById('quizContent').innerHTML=`<div><b>ERO</b><div>${e||'<span class="muted">Isi ERO_MASTER terlebih dahulu.</span>'}</div></div>
  <div style="margin-top:12px"><b>SL</b><div class="opts" style="margin:6px 0"><label><input type="radio" name="quizsl" value="Ya" ${r.sl==='Ya'?'checked':''}> Ya</label><label><input type="radio" name="quizsl" value="Belum" ${r.sl!=='Ya'?'checked':''}> Belum</label></div></div>
  <button type="button" style="margin-top:8px;padding:9px 13px;border-radius:9px;background:var(--blue);color:#fff" onclick="saveQuiz()">Simpan Status Quiz</button>`;
 }).catch(()=>{});
}
function saveQuiz(){
 const items=[];
 document.querySelectorAll('[data-quiz-ero]').forEach(x=>items.push({type:'ERO',name:x.dataset.quizEro,status:x.checked?'Ya':'Belum'}));
 const sl=document.querySelector('input[name="quizsl"]:checked');if(sl)items.push({type:'SL',name:'SL',status:sl.value});
 api('saveQuiz',{date:today(),user:state.user,items}).then(r=>{if(r.ok)alert('Status Monthly Quiz tersimpan.');});
}
function submitChecklist(){
 const answers=[]; for(const q of state.questions){const el=document.querySelector(`[data-no="${q.no}"]`);const a=el.querySelector(`input[name="q${q.no}"]:checked`);if(!a){alert(`Pertanyaan nomor ${q.no} belum dijawab.`);el.scrollIntoView({behavior:'smooth'});return}
  const obj={no:q.no,answer:a.value,note:el.querySelector('[data-note]').value};
  el.querySelectorAll('[data-extra]').forEach(x=>obj[x.dataset.extra]=x.value);answers.push(obj)
 }
 api('submitChecklist',{user:state.user,date:today(),answers}).then(r=>{if(r.ok){alert('Checklist tersimpan.');showPage('dashboard');}else alert(r.message||'Gagal menyimpan')}).catch(()=>alert('Gagal terhubung ke Apps Script.'))
}
function loadHistory(){
 api('history',{store:state.user.store,limit:50}).then(r=>document.getElementById('history').innerHTML=`<div class="panel"><table class="table"><tr><th>Tanggal</th><th>Jam</th><th>Leader</th><th>Store</th><th>Temuan</th></tr>${(r.rows||[]).map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${esc(x.leader)}</td><td>${esc(x.store)}</td><td class="red">${x.findings}</td></tr>`).join('')}</table></div>`)
}
function loadFindings(){
 api('findings',{store:state.user.store,limit:100}).then(r=>document.getElementById('findings').innerHTML=`<div class="panel"><table class="table"><tr><th>Tanggal</th><th>Jam</th><th>Store</th><th>Pertanyaan</th><th>Catatan</th></tr>${(r.rows||[]).map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${esc(x.store)}</td><td>${esc(x.question)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>`)
}
function loadMonthly(){
 const m=today().slice(0,7);api('monthly',{store:state.user.store,month:m}).then(r=>document.getElementById('monthly').innerHTML=`<div class="panel"><h3>Trend Temuan — ${m}</h3>${bars(r.items||[],'red')}</div>`)
}
function loadAllArea(){
 api('allArea',{month:today().slice(0,7)}).then(r=>document.getElementById('allarea').innerHTML=`<div class="grid2"><div class="panel"><h3>🔴 Temuan All Area</h3>${bars(r.items||[],'red')}</div><div class="panel"><h3>Per Store</h3><table class="table"><tr><th>Store</th><th>Checklist</th><th>Temuan</th><th>Last Check</th></tr>${(r.stores||[]).map(x=>`<tr><td>${esc(x.store)}</td><td>${x.checks}</td><td class="red">${x.findings}</td><td>${x.lastTime||'-'}</td></tr>`).join('')}</table></div></div>`)
}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'}),1000);
document.getElementById('clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});
const saved=localStorage.getItem('lc_user');if(saved){state.user=JSON.parse(saved);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('identity').textContent=`${state.user.name} • ${state.user.role} • ${state.user.storeName||'ALL AREA'}`;if(!['TSH','ADMIN'].includes(state.user.role)){document.getElementById('allAreaNav').style.display='none';document.getElementById('mobileAllAreaNav').style.display='none';}loadDashboard()}
</script>
</body>
</html>
