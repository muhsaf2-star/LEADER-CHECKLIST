<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Leader Checklist</title>
<style>
:root{
  --green:#16a34a;--green2:#0f8a3b;--greenSoft:#eaf8ef;--greenSoft2:#d8f2e2;
  --red:#ef4444;--redSoft:#fff0f0;--amber:#f59e0b;--amberSoft:#fff7e6;
  --text:#17201a;--muted:#718078;--line:#e5ebe7;--bg:#f5f8f6;--white:#fff;
  --shadow:0 8px 28px rgba(22,70,40,.07);--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#087a35,#16a34a 55%,#8bd5a6)}
.login-card{width:min(390px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(0,60,25,.22)}
.logoMark{width:54px;height:54px;border-radius:17px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:27px;margin-bottom:15px}
.login-card h1{font-size:22px;margin:0}.login-card p{margin:6px 0 24px;color:var(--muted);font-size:13px}
.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}
.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:none}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--greenSoft)}
.primary{width:100%;border:0;border-radius:12px;padding:12px;background:var(--green);color:#fff;font-weight:850;margin-top:6px}
.error{color:var(--red);font-size:11px;margin-top:9px;min-height:15px}

.shell{max-width:1180px;margin:0 auto;min-height:100vh}
.desktopSide{position:fixed;width:230px;top:0;bottom:0;background:#fff;border-right:1px solid var(--line);padding:22px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px;padding:0 8px 25px}
.brandIcon{width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center}
.sideBtn{width:100%;border:0;background:transparent;color:#66736c;text-align:left;padding:11px 12px;border-radius:12px;font-weight:700;margin:2px 0}
.sideBtn.active,.sideBtn:hover{background:var(--greenSoft);color:var(--green2)}
.sideBottom{position:absolute;bottom:20px;left:14px;right:14px}
.main{margin-left:230px;padding:18px 20px 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.greeting{font-size:20px;font-weight:850;margin:0}.subline{font-size:11px;color:var(--muted);margin-top:4px}
.topRight{display:flex;align-items:center;gap:8px}
.storePill{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:10px;font-weight:800}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:850}
.mobileTop{display:none}

.page{display:block}
.sectionTitle{font-size:13px;font-weight:900;margin:18px 0 9px}
.hero{
  background:linear-gradient(135deg,#f0fbf4,#fff);
  border:1px solid #dcefe2;border-radius:22px;padding:18px;box-shadow:var(--shadow)
}
.heroTop{display:flex;gap:13px;align-items:flex-start}
.heroIcon{width:48px;height:48px;border-radius:15px;background:var(--greenSoft2);color:var(--green);display:grid;place-items:center;font-size:25px;flex:0 0 auto}
.eyebrow{font-size:10px;font-weight:900;color:var(--green2);letter-spacing:.04em}
.hero h2{font-size:21px;line-height:1.18;margin:4px 0 5px}
.hero p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
.heroAction{margin-top:16px;width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px;font-size:12px;font-weight:900}
.heroAction.outline{background:#fff;color:var(--green2);border:1px solid #9dd5ae}
.heroAction.disabled{background:#e9eeeb;color:#8b9690;cursor:not-allowed}
.progressMeta{display:flex;justify-content:space-between;font-size:11px;font-weight:850;margin-top:14px}
.progress{height:9px;background:#e2ebe5;border-radius:999px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px}
.timestamp{font-size:10px;color:var(--muted);margin-top:7px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}
.statIcon{font-size:17px}.statValue{font-size:20px;font-weight:900;margin-top:2px}.statLabel{font-size:10px;color:var(--muted);font-weight:700}
.stat.finding .statValue{color:var(--red)}.stat.ok .statValue{color:var(--green)}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.quizCard{margin-top:11px}
.quizHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.quizTitle{font-size:11px;font-weight:900;letter-spacing:.03em}
.quizArrow{font-size:18px;color:#93a099}
.quizLine{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:11px}
.quizLine strong{color:var(--green2)}
.miniProgress{height:7px;background:#e8efea;border-radius:99px;overflow:hidden;flex:1;margin:0 9px}
.miniProgress i{display:block;height:100%;background:var(--green);border-radius:99px}
.quizNames{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.nameChip{font-size:9px;padding:5px 7px;border-radius:999px;background:var(--greenSoft);color:var(--green2);font-weight:800}
.nameChip.pending{background:var(--redSoft);color:#c62828}
.slRow{font-size:10px;color:var(--muted);margin-top:9px}.slRow b{color:var(--green2)}

.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.panelTitle{font-size:12px;font-weight:900;margin:0 0 11px}
.findingList,.okList{display:grid;gap:7px}
.listRow{padding:9px 10px;border:1px solid var(--line);border-radius:12px;font-size:10px}
.listRow small{display:block;color:var(--muted);margin-top:3px}
.findingRow{border-left:3px solid var(--red)}
.okRow{border-left:3px solid var(--green)}

.checkHeader{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5}
.backBtn{border:0;background:#f0f5f1;color:var(--green2);width:34px;height:34px;border-radius:10px;font-size:18px}
.checkTop{display:flex;align-items:center;gap:10px}
.checkTitle{font-size:15px;font-weight:900}
.checkSub{font-size:10px;color:var(--muted);margin-top:2px}
.checkStats{display:flex;justify-content:space-between;margin-top:13px;font-size:11px;font-weight:850}
.questions{margin-top:10px;display:grid;gap:8px}
.question{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}
.qtop{display:flex;gap:9px;align-items:flex-start}.qno{font-size:10px;font-weight:900;color:var(--green);min-width:22px}.qtext{font-size:11px;font-weight:800;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.opt{border:1px solid #dfe7e1;background:#fff;border-radius:10px;padding:9px 7px;text-align:center;font-size:10px;font-weight:800;color:#56625b}
.opt input{display:none}
.opt:has(input:checked){background:var(--green);border-color:var(--green);color:#fff}
.opt.find:has(input:checked){background:var(--red);border-color:var(--red);color:#fff}
.note{margin-top:8px}.note textarea,.extra input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:10px;outline:none;resize:vertical;min-height:52px}
.note textarea:focus,.extra input:focus{border-color:var(--green)}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.saveBar{position:sticky;bottom:8px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.saveInfo{font-size:9px;color:var(--muted)}.saveBtns{display:flex;gap:6px}
.btn{border:0;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:900}.btnGreen{background:var(--green);color:#fff}.btnOutline{background:#fff;color:var(--green2);border:1px solid #9dd5ae}.btnGray{background:#e9eeeb;color:#87918b}.btnRed{background:var(--red);color:#fff}

.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:9px;color:var(--muted)}
.statusGood{color:var(--green2);font-weight:900}.statusBad{color:#c62828;font-weight:900}.statusWait{color:#a36a00;font-weight:900}

.quizTabs{display:grid;grid-template-columns:1fr 1fr;background:#edf3ef;border-radius:11px;padding:3px;margin:11px 0}.quizTab{border:0;background:transparent;border-radius:9px;padding:8px;font-size:10px;font-weight:850;color:var(--muted)}.quizTab.active{background:#fff;color:var(--green2);box-shadow:0 2px 8px #00000008}
.monthNav{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900}.monthNav button{border:0;background:#f0f5f1;border-radius:9px;width:32px;height:32px;color:var(--green2)}
.people{display:grid;gap:7px}.person{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:12px}.personName{font-size:10px;font-weight:800}.badge{font-size:9px;font-weight:900;border-radius:999px;padding:5px 8px}.badge.done{background:var(--greenSoft);color:var(--green2)}.badge.pending{background:var(--redSoft);color:#c62828}

.moreGrid{display:grid;gap:9px}.moreBtn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}.moreBtn strong{font-size:11px}.moreBtn span{font-size:9px;color:var(--muted);display:block;margin-top:3px}
.mobileNav{display:none}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17201a;color:#fff;padding:10px 13px;border-radius:11px;font-size:10px;z-index:1000;box-shadow:0 8px 30px #0003}

@media(max-width:800px){
  .desktopSide{display:none}.main{margin-left:0;padding:12px 11px 86px}.mobileTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .topbar{display:none}.greeting{font-size:17px}.subline{font-size:10px}.topRight .storePill{display:none}
  .avatar{width:34px;height:34px}
  .hero{padding:15px}.hero h2{font-size:19px}.heroAction{padding:11px}
  .twoCol{grid-template-columns:1fr}
  .checkHeader{top:4px}.questions{gap:7px}.question{padding:10px}.qtext{font-size:10px}
  .saveBar{bottom:72px}.saveInfo{max-width:105px}
  .mobileNav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .mobileNav button{border:0;background:transparent;color:#819088;font-size:9px;font-weight:800}.mobileNav button.active{color:var(--green2)}.mobileNav .ico{font-size:18px;display:block;margin-bottom:2px}
}
@media(min-width:801px){.main{max-width:950px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="logoMark">✓</div>
    <h1>Leader Checklist</h1>
    <p>Daily Store Operation • Samsung SMB</p>
    <div class="field"><label>USERNAME</label><input id="username" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="primary" onclick="doLogin()">MASUK</button>
    <div id="loginErr" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="desktopSide">
    <div class="brand"><span class="brandIcon">✓</span> LEADER CHECKLIST</div>
    <button class="sideBtn active" data-page="home" onclick="go('home')">⌂ &nbsp; Home</button>
    <button class="sideBtn" data-page="report" onclick="go('report')">▣ &nbsp; Report</button>
    <button class="sideBtn" data-page="quiz" onclick="go('quiz')">✓ &nbsp; Monthly Quiz</button>
    <button class="sideBtn" data-page="more" onclick="go('more')">☰ &nbsp; More</button>
    <div class="sideBottom"><button class="sideBtn" onclick="logout()">↪ &nbsp; Logout</button></div>
  </aside>

  <main class="main">
    <div class="mobileTop">
      <div>
        <div class="greeting" id="mGreeting">Good Morning 👋</div>
        <div class="subline" id="mDate"></div>
      </div>
      <div class="avatar" id="mAvatar">LC</div>
    </div>

    <div class="topbar">
      <div>
        <div class="greeting" id="greeting">Good Morning 👋</div>
        <div class="subline" id="dateLine"></div>
      </div>
      <div class="topRight"><span class="storePill" id="storePill"></span><div class="avatar" id="avatar">LC</div></div>
    </div>

    <section id="home" class="page"></section>
    <section id="check" class="page hidden"></section>
    <section id="report" class="page hidden"></section>
    <section id="quiz" class="page hidden"></section>
    <section id="more" class="page hidden"></section>
    <section id="findings" class="page hidden"></section>
    <section id="allarea" class="page hidden"></section>
  </main>

  <nav class="mobileNav">
    <button class="active" data-page="home" onclick="go('home')"><span class="ico">⌂</span>Home</button>
    <button data-page="report" onclick="go('report')"><span class="ico">▣</span>Report</button>
    <button data-page="more" onclick="go('more')"><span class="ico">☰</span>More</button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyIau4TJNG_KeY3L3kR7C8TT1hnnOIZz2ODhYy-0NMDlO_0EDa2AOir-yiK7hfTsslLcw/exec';
const QUESTIONS=[
[1,'Grooming Staff sesuai?'],[2,'Apakah ada team standby saat masuk?'],[3,'Apakah Area Floor bersih?'],
[4,'Apakah Area LDU Bersih dari kotoran?'],[5,'Apakah LDU ada yg mati?'],[6,'Apakah TV promotion Hidup dan memutar materi promo?'],
[7,'Apakah Retail Mode menyala dan Price App update?'],[8,'Apakah penataan acc sudah sesuai?'],[9,'Apakah Mesin Edc berfungsi siap digunakan?'],
[10,'Apakah Price list dan Promo sudah update di PL?'],[11,'Apakah ada lampu yang mati?'],[12,'Apakah Area gudang staff bersih?'],
[13,'Apakah Gudang device rapih?'],[14,'Apakah sudah setoran?'],[15,'Apakah sudah SO Harian?'],
[16,'Apakah Ada barang Gantung antar store/dari gudang/retur ke gudang?'],[17,'Apakah ada barang CPFR Belum di GR?'],
[18,'Apakah trade in sudah Ready for Pickup?'],[19,'CEK DO, apakah sudah di arsip?'],[20,'Cek internet, Apakah Berfungsi?'],
[21,'Apakah sudah melakukan Briefing?'],[22,'Apakah cctv menyala?'],[23,'Apakah ada Barang DOA / Returan ke gudang?'],
[24,'Apakah Monthly Quiz sudah selesai?']
];
let state={user:null,checkState:null,questions:QUESTIONS.map(x=>({no:x[0],question:x[1]}))};

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}
function fmtDate(d=new Date()){return d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'})}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.add('hidden'),2600)}
function api(action,payload={}){
  return new Promise((resolve,reject)=>{
    const cb='LC_CB_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    const script=document.createElement('script');
    let finished=false;
    const timeout=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('TIMEOUT'));
    },12000);

    function cleanup(){
      clearTimeout(timeout);
      try{delete window[cb]}catch(e){}
      if(script.parentNode)script.parentNode.removeChild(script);
    }

    window[cb]=data=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve(data);
    };

    script.async=true;
    script.referrerPolicy='no-referrer';
    script.onerror=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('NETWORK'));
    };

    const query =
      'action='+encodeURIComponent(action)+
      '&callback='+encodeURIComponent(cb)+
      '&payload='+encodeURIComponent(JSON.stringify(payload))+
      '&_='+Date.now();

    script.src=API_URL+'?'+query;
    document.head.appendChild(script);
  });
}

async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('loginErr');
  const btn=document.querySelector('#loginCard button.primary') || document.querySelector('.login-card button.primary');

  if(!username || !password){
    err.textContent='Username dan password wajib diisi.';
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent='MENGHUBUNGKAN...';
    btn.style.opacity='.7';
  }
  err.textContent='Memeriksa login...';

  try{
    const r=await api('login',{username:username,password:password});
    if(!r || !r.ok){
      err.textContent=(r && r.message) ? r.message : 'Username atau password salah.';
      return;
    }
    state.user=r.user;
    localStorage.setItem('leaderChecklistUser',JSON.stringify(r.user));
    openApp();
  }catch(e){
    if(e && e.message==='TIMEOUT'){
      err.textContent='Koneksi ke server timeout. Pastikan Web App Apps Script sudah DEPLOY versi terbaru.';
    }else{
      err.textContent='API belum terhubung. Cek URL Web App Apps Script.';
    }
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent='MASUK';
      btn.style.opacity='1';
    }
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  const u=document.getElementById('username');
  const p=document.getElementById('password');
  [u,p].forEach(el=>el&&el.addEventListener('keydown',e=>{
    if(e.key==='Enter')doLogin();
  }));
});
function openApp(){
  document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  const name=state.user.name||'Leader', initials=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('greeting').textContent=`Good Morning, ${name} 👋`;
  document.getElementById('mGreeting').textContent=`Good Morning, ${name} 👋`;
  document.getElementById('dateLine').textContent=fmtDate();
  document.getElementById('mDate').textContent=fmtDate();
  document.getElementById('avatar').textContent=initials;document.getElementById('mAvatar').textContent=initials;
  document.getElementById('storePill').textContent=state.user.storeName||'ALL AREA';
  go('home');
}
function logout(){localStorage.removeItem('leaderChecklistUser');location.reload()}
function hideAll(){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'))}
function activeNav(page){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function go(page){
  hideAll();activeNav(page);
  const el=document.getElementById(page);if(el)el.classList.remove('hidden');
  if(page==='home')loadHome();
  if(page==='report')loadReport();
  if(page==='quiz')loadQuizPage();
  if(page==='more')loadMore();
  if(page==='findings')loadFindings();
  if(page==='allarea')loadAllArea();
}
function checkPage(){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  document.getElementById('check').classList.remove('hidden');
  activeNav('home');
  loadChecklist();
}
function backHome(){go('home')}

async function loadHome(){
  const el=document.getElementById('home');
  el.innerHTML='<div class="card">Memuat dashboard...</div>';
  try{
    const [cs,dash,q]=await Promise.all([
      api('checklistState',{date:today(),user:state.user}),
      api('dashboard',{date:today(),store:state.user.store,user:state.user}),
      api('quiz',{date:today(),store:state.user.store})
    ]);
    state.checkState=cs;
    const answers=cs.answers||[], total=24, filled=answers.length, pct=Math.round(filled/total*100);
    const posted=!!cs.posted,draft=!!cs.draft;
    let hero='';
    if(posted){
      hero=`<div class="hero">
        <div class="heroTop"><div class="heroIcon">✓</div><div><div class="eyebrow">DAILY CHECKLIST</div><h2>Checklist-mu hari ini<br>sudah selesai</h2><p>Semua 24 item sudah diposting dan terkunci.</p></div></div>
        <div class="progressMeta"><span>24 / 24 item</span><span>100%</span></div><div class="progress"><i style="width:100%"></i></div>
        <div class="timestamp">Diposting ${esc(dash.lastTime||cs.updatedTime||'-')}</div>
        <button class="heroAction outline" onclick="unpost()">✎ &nbsp; UNPOSTING / EDIT</button>
      </div>`;
    }else if(draft){
      hero=`<div class="hero">
        <div class="heroTop"><div class="heroIcon">↗</div><div><div class="eyebrow">DAILY CHECKLIST</div><h2>Ayo selesaikan<br>Checklist-mu hari ini</h2><p>Draft kamu sudah tersimpan. Lanjutkan dari item terakhir.</p></div></div>
        <div class="progressMeta"><span>${filled} / 24 item</span><span>${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div>
        <button class="heroAction" onclick="checkPage()">LANJUTKAN CHECKLIST →</button>
      </div>`;
    }else{
      hero=`<div class="hero">
        <div class="heroTop"><div class="heroIcon">☑</div><div><div class="eyebrow">DAILY CHECKLIST</div><h2>Ayo checklist harianmu<br>belum dilakukan</h2><p>Mari pastikan semua area store dalam kondisi terbaik.</p></div></div>
        <button class="heroAction" onclick="checkPage()">MULAI CHECKLIST →</button>
      </div>`;
    }
    const okCount=dash.okItems?.length||0, findCount=dash.findings?.length||0;
    const eros=q.eros||[],done=eros.filter(x=>q.completed?.['ERO|'+x.NAME]),pending=eros.filter(x=>!q.completed?.['ERO|'+x.NAME]);
    el.innerHTML=hero+
      `<div class="stats"><div class="stat ok"><div class="statIcon">✓</div><div class="statValue">${okCount}</div><div class="statLabel">OK hari ini</div></div><div class="stat finding"><div class="statIcon">⚠</div><div class="statValue">${findCount}</div><div class="statLabel">Finding hari ini</div></div></div>`+
      `<div class="card quizCard"><div class="quizHead"><div class="quizTitle">MONTHLY QUIZ</div><button class="btn btnOutline" onclick="go('quiz')">Lihat →</button></div>
        <div class="quizLine"><strong>ERO</strong><span>${done.length} / ${eros.length} selesai</span><div class="miniProgress"><i style="width:${eros.length?Math.round(done.length/eros.length*100):0}%"></i></div><b>${eros.length?Math.round(done.length/eros.length*100):0}%</b></div>
        <div class="quizNames">${done.map(x=>`<span class="nameChip">✓ ${esc(x.NAME)}</span>`).join('')}${pending.map(x=>`<span class="nameChip pending">× ${esc(x.NAME)}</span>`).join('')}</div>
        <div class="slRow">SL: <b>${q.slDone?'✓ Sudah dilakukan':'Belum dilakukan'}</b></div>
      </div>`;
    if(findCount)el.innerHTML+=`<div class="card" style="margin-top:11px"><div class="panelTitle">🔴 Finding Hari Ini</div><div class="findingList">${(dash.findings||[]).map(x=>`<div class="listRow findingRow"><b>${esc(x.question)}</b><small>${esc(x.note||'Tidak ada catatan')} • ${esc(x.time||'')}</small></div>`).join('')}</div></div>`;
  }catch(e){el.innerHTML='<div class="card">Gagal memuat dashboard. Coba refresh.</div>'}
}
async function loadChecklist(){
  const el=document.getElementById('check');
  el.innerHTML='<div class="card">Memuat checklist...</div>';
  try{
    const r=await api('checklistState',{date:today(),user:state.user});state.checkState=r;
    const map={};(r.answers||[]).forEach(a=>map[a.no]=a);
    const posted=!!r.posted;
    el.innerHTML=`<div class="checkHeader">
      <div class="checkTop"><button class="backBtn" onclick="backHome()">‹</button><div><div class="checkTitle">Daily Checklist</div><div class="checkSub">${esc(state.user.storeName||'ALL AREA')} • ${fmtDate()}</div></div></div>
      <div class="checkStats"><span id="checkCount">0 / 24 item</span><span id="checkPct">0%</span></div><div class="progress"><i id="checkBar" style="width:0%"></i></div>
      ${posted?'<div style="margin-top:10px;background:#eef9f2;border:1px solid #bfe4ca;color:#176c36;border-radius:11px;padding:9px;font-size:10px;font-weight:800">✓ Checklist hari ini sudah selesai dan terkunci. Kamu sedang dalam mode edit setelah Unposting.</div>':''}
    </div>
    <div class="questions">${state.questions.map(q=>questionHtml(q,map[q.no]||{})).join('')}</div>
    <div class="saveBar"><div class="saveInfo" id="saveInfo">Posting hanya bisa jika 24/24 terisi.</div><div class="saveBtns"><button class="btn btnOutline" onclick="saveDraft()">SIMPAN SEMENTARA</button><button id="postBtn" class="btn btnGreen" onclick="postChecklist()">POSTING</button></div></div>`;
    updateProgress();
  }catch(e){el.innerHTML='<div class="card">Gagal memuat checklist.</div>'}
}
function questionHtml(q,a){
  const second=q.no===24?'Belum':'Tidak';
  const isFinding=a.answer==='Ya' && [5,11,16,17,23].includes(q.no) || a.answer==='Tidak' && ![5,11,16,17,23].includes(q.no);
  let extra='';
  if(q.no===14)extra=`<div class="extra"><input data-extra="value" placeholder="Value setoran" value="${esc(a.value||'')}"><input data-extra="depositor" placeholder="Nama penyetor" value="${esc(a.depositor||'')}"></div>`;
  if(q.no===15)extra=`<div class="extra"><input data-extra="so" placeholder="Nama yang SO" value="${esc(a.so||'')}"><input data-extra="companion" placeholder="Pendamping SO" value="${esc(a.companion||'')}"></div>`;
  return `<div class="question" data-no="${q.no}">
    <div class="qtop"><span class="qno">${String(q.no).padStart(2,'0')}</span><span class="qtext">${esc(q.question)}</span></div>
    <div class="opts">
      <label class="opt ${isFinding&&a.answer==='Ya'?'find':''}"><input type="radio" name="q${q.no}" value="Ya" ${a.answer==='Ya'?'checked':''}>Ya</label>
      <label class="opt ${isFinding&&a.answer===second?'find':''}"><input type="radio" name="q${q.no}" value="${second}" ${a.answer===second?'checked':''}>${second}</label>
    </div>
    <div class="note"><textarea data-note placeholder="Catatan (isi bila ada temuan / keterangan)">${esc(a.note||'')}</textarea></div>${extra}
  </div>`;
}
function collect(){
  const answers=[],missing=[];
  for(const q of state.questions){
    const box=document.querySelector(`[data-no="${q.no}"]`),chosen=box?.querySelector(`input[name="q${q.no}"]:checked`);
    if(!chosen){missing.push(q.no);continue}
    const a={no:q.no,answer:chosen.value,note:box.querySelector('[data-note]')?.value||''};
    box.querySelectorAll('[data-extra]').forEach(x=>a[x.dataset.extra]=x.value);
    answers.push(a);
  }
  return {answers,missing};
}
function updateProgress(){
  const c=collect(),n=c.answers.length,p=Math.round(n/24*100);
  const a=document.getElementById('checkCount'),b=document.getElementById('checkPct'),bar=document.getElementById('checkBar'),btn=document.getElementById('postBtn'),info=document.getElementById('saveInfo');
  if(a)a.textContent=`${n} / 24 item`;if(b)b.textContent=p+'%';if(bar)bar.style.width=p+'%';
  if(btn){btn.disabled=n<24;btn.className='btn '+(n<24?'btnGray':'btnGreen');btn.textContent=n<24?'LENGKAPI 24 ITEM':'POSTING CHECKLIST'}
  if(info)info.textContent=n<24?`${n}/24 terisi • Posting terkunci sampai lengkap.`:'24/24 lengkap • Siap diposting.';
}
document.addEventListener('change',e=>{if(e.target.closest('#check'))updateProgress()});

async function saveDraft(){
  const c=collect();
  try{const r=await api('saveDraft',{date:today(),user:state.user,answers:c.answers});if(r.ok){toast(`Draft tersimpan • ${c.answers.length}/24 item`);loadHome()}else toast(r.message||'Gagal menyimpan')}catch(e){toast('Gagal terhubung ke Apps Script')}
}
async function postChecklist(){
  const c=collect();
  if(c.missing.length){toast('Lengkapi semua 24 item terlebih dahulu');document.querySelector(`[data-no="${c.missing[0]}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(!confirm('Posting checklist hari ini? Setelah posting, checklist akan terkunci.'))return;
  try{const r=await api('postChecklist',{date:today(),user:state.user,answers:c.answers});if(r.ok){toast(r.updated?'Checklist berhasil diperbarui':'Checklist berhasil diposting');go('home')}else toast(r.message||'Gagal posting')}catch(e){toast('Gagal terhubung ke Apps Script')}
}
async function unpost(){
  if(!confirm('Buka kembali checklist hari ini untuk edit? Data lama akan dibuka sebagai draft dan bisa diposting ulang.'))return;
  try{const r=await api('unpostChecklist',{date:today(),user:state.user});if(r.ok){toast('Checklist dibuka untuk edit');checkPage()}else toast(r.message||'Gagal unposting')}catch(e){toast('Gagal terhubung ke Apps Script')}
}

async function loadReport(){
  const el=document.getElementById('report');el.innerHTML='<div class="card">Memuat report...</div>';
  try{const r=await api('history',{store:state.user.store,limit:100});
    el.innerHTML=`<div class="card"><div class="panelTitle">Riwayat Checklist</div><div class="tableWrap"><table class="table"><tr><th>Tanggal</th><th>Jam</th><th>Status</th><th>Finding</th></tr>${(r.rows||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.time)}</td><td class="statusGood">✓ Selesai</td><td class="${Number(x.findings)>0?'statusBad':'statusGood'}">${Number(x.findings)>0?x.findings+' Finding':'Tidak ada Finding'}</td></tr>`).join('')}</table></div></div>`;
  }catch(e){el.innerHTML='<div class="card">Gagal memuat report.</div>'}
}
async function loadQuizPage(){
  const el=document.getElementById('quiz');el.innerHTML='<div class="card">Memuat Monthly Quiz...</div>';
  try{const r=await api('quiz',{date:today(),store:state.user.store}),eros=r.eros||[],done=eros.filter(x=>r.completed?.['ERO|'+x.NAME]),pending=eros.filter(x=>!r.completed?.['ERO|'+x.NAME]);
    el.innerHTML=`<div class="card"><div class="monthNav"><button onclick="loadQuizPage()">‹</button><span>${esc(r.month||today().slice(0,7))}</span><button onclick="loadQuizPage()">›</button></div>
      <div class="quizTabs"><button class="quizTab active">ERO (${eros.length})</button><button class="quizTab">SL (1)</button></div>
      <div class="people">${eros.map(x=>`<div class="person"><span class="personName">${esc(x.NAME)}</span><span class="badge ${r.completed?.['ERO|'+x.NAME]?'done':'pending'}">${r.completed?.['ERO|'+x.NAME]?'Sudah':'Belum'}</span></div>`).join('')||'<div class="subline">Belum ada ERO di ERO_MASTER.</div>'}</div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)" class="${r.slDone?'statusGood':'statusWait'}">SL: ${r.slDone?'✓ Sudah dilakukan bulan ini':'○ Belum dilakukan bulan ini'}</div>
      <div class="subline" style="margin-top:10px">Monthly Quiz hanya dapat diselesaikan 1 kali per ERO setiap bulan.</div>
    </div>`;
  }catch(e){el.innerHTML='<div class="card">Gagal memuat Monthly Quiz.</div>'}
}
function loadMore(){
  const isTSH=['TSH','ADMIN'].includes(String(state.user.role||'').toUpperCase());
  document.getElementById('more').innerHTML=`<div class="sectionTitle">More</div><div class="moreGrid">
    <button class="moreBtn" onclick="go('quiz')"><div><strong>Monthly Quiz</strong><span>Status ERO & SL bulan berjalan</span></div><b>→</b></button>
    <button class="moreBtn" onclick="go('findings')"><div><strong>Finding</strong><span>Daftar temuan checklist</span></div><b>→</b></button>
    ${isTSH?'<button class="moreBtn" onclick="go(\\'allarea\\')"><div><strong>All Area</strong><span>Monitoring seluruh store</span></div><b>→</b></button>':''}
    <button class="moreBtn" onclick="logout()"><div><strong>Logout</strong><span>Keluar dari akun</span></div><b>↪</b></button>
  </div>`;
}
async function loadFindings(){
  const el=document.getElementById('findings');el.innerHTML='<div class="card">Memuat finding...</div>';
  try{const r=await api('findings',{store:state.user.store,limit:100});
    el.innerHTML=`<div class="card"><div class="panelTitle">Finding</div><div class="findingList">${(r.rows||[]).map(x=>`<div class="listRow findingRow"><b>${esc(x.question)}</b><small>${esc(x.date)} • ${esc(x.time)} • ${esc(x.note||'Tidak ada catatan')}</small></div>`).join('')||'<div class="subline">Tidak ada finding.</div>'}</div></div>`;
  }catch(e){el.innerHTML='<div class="card">Gagal memuat finding.</div>'}
}
async function loadAllArea(){
  const el=document.getElementById('allarea');el.innerHTML='<div class="card">Memuat All Area...</div>';
  try{const r=await api('allArea',{month:today().slice(0,7)});
    el.innerHTML=`<div class="card"><div class="panelTitle">All Area • ${today().slice(0,7)}</div><div class="tableWrap"><table class="table"><tr><th>Store</th><th>Checklist</th><th>Finding</th><th>Last Check</th></tr>${(r.stores||[]).map(x=>`<tr><td>${esc(x.store)}</td><td>${x.checks}</td><td class="${Number(x.findings)>0?'statusBad':'statusGood'}">${x.findings}</td><td>${esc(x.lastTime||'-')}</td></tr>`).join('')}</table></div></div>`;
  }catch(e){el.innerHTML='<div class="card">Gagal memuat All Area.</div>'}
}
const saved=localStorage.getItem('leaderChecklistUser');
if(saved){try{state.user=JSON.parse(saved);openApp()}catch(e){localStorage.removeItem('leaderChecklistUser')}}
</script>
